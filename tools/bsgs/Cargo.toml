[package]
name = "bsgs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bsgs"
path = "src/main.rs"

[dependencies]
k256 = { version = "0.13", features = ["arithmetic"] }
elliptic-curve = "0.13"
rayon = "1"
sha3 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
