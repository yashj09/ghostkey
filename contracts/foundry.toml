[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./" }]
# Tests call the Rust SPHINCS signer (tools/sphincs-signer) via FFI. Build it first.
ffi = true

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
